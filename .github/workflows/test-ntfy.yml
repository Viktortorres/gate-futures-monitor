name: Test NTFY Push

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Send test notification
        run: |
          curl -f \
            -H "Title: Gate Futures" \
            -H "Priority: high" \
            -H "Tags: white_check_mark" \
            -d "Тест Gate Monitor — уведомления работают!" \
            "https://ntfy.sh/$NTFY_TOPIC"
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
